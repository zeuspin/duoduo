name: desktop-build
on:
  workflow_dispatch:
  push:
    paths: ["demo/app/**"]
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: macos-14
            make_args: "--platform=darwin --arch=arm64"
          - os: windows-latest
            make_args: "--platform=win32 --arch=x64"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: demo/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan:secrets
      - run: npm run make -- ${{ matrix.make_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: duoduo-${{ matrix.os }}
          path: demo/app/out/make/**
