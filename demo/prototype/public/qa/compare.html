<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设计对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #e9edf1; color: #18212b; }
    h1 { margin: 0 0 20px; font-size: 20px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    section { background: white; border: 1px solid #b8c0c9; }
    h2 { margin: 0; padding: 12px 14px; border-bottom: 1px solid #d9dee4; font-size: 14px; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>主控台：第一轮概念稿与第二轮交互稿</h1>
  <main>
    <section><h2>来源：第一轮 A 主控台概念</h2><img src="source.png" alt="第一轮概念稿"></section>
    <section><h2>实现：第二轮可交互主控台</h2><img src="final.png" alt="第二轮交互稿"></section>
  </main>
</body>
</html>
