<!doctype html><html lang="zh-CN" data-theme="ink"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观风主题切换演示</title><link rel="stylesheet" href="themes.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--color-background);color:var(--color-text);font-family:system-ui,"PingFang SC",sans-serif;transition:.25s}.shell{max-width:1080px;margin:auto;padding:32px}.top{display:flex;align-items:center;gap:16px}.top img{width:72px;border-radius:18px}.panel{margin-top:28px;padding:28px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px;box-shadow:0 18px 50px var(--color-shadow)}.actions{display:flex;gap:12px}.primary{border:0;border-radius:999px;padding:12px 22px;background:var(--color-primary);color:var(--color-on-primary)}.secondary{border:1px solid var(--color-border);border-radius:999px;padding:12px 22px;background:var(--color-surface);color:var(--color-text)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{min-height:120px;padding:20px;border-radius:18px;background:var(--color-selected);border:1px solid var(--color-border)}.themes{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:28px}.theme-option{border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);border-radius:18px;padding:12px;cursor:pointer}.theme-option img{width:100%;border-radius:14px}.theme-option span{display:block;margin-top:8px}</style></head><body><main class="shell"><div class="top"><img id="brandIcon" src="../colorways/01-ink.png"><div><h1>观风</h1><p>六套主题实时切换演示</p></div></div><section class="panel"><h2>让信息像风一样被看见</h2><p style="color:var(--color-text-secondary)">此页面展示背景、卡片、按钮、边框、选中态与文字层级在不同主题中的变化。</p><div class="actions"><button class="primary">主要操作</button><button class="secondary">次要操作</button></div><div class="grid"><div class="card">主题卡片 A</div><div class="card">主题卡片 B</div><div class="card">主题卡片 C</div></div></section><div class="themes"><button class="theme-option" data-set="ink" aria-label="切换至宣纸墨"><img src="../colorways/01-ink.png"><span>宣纸墨</span></button><button class="theme-option" data-set="navy" aria-label="切换至观海蓝"><img src="../colorways/02-navy.png"><span>观海蓝</span></button><button class="theme-option" data-set="jade" aria-label="切换至松石青"><img src="../colorways/03-jade.png"><span>松石青</span></button><button class="theme-option" data-set="cinnabar" aria-label="切换至朱砂红"><img src="../colorways/04-cinnabar.png"><span>朱砂红</span></button><button class="theme-option" data-set="gold" aria-label="切换至玄黑金"><img src="../colorways/05-gold.png"><span>玄黑金</span></button><button class="theme-option" data-set="violet" aria-label="切换至云雾紫"><img src="../colorways/06-violet.png"><span>云雾紫</span></button></div></main><script>const icons={"ink":"01-ink","navy":"02-navy","jade":"03-jade","cinnabar":"04-cinnabar","gold":"05-gold","violet":"06-violet"};document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.set;document.querySelector('#brandIcon').src='../colorways/'+icons[b.dataset.set]+'.png'})</script></body></html>
